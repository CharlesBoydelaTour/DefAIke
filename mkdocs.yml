site_name: DefAIke
site_description: Evidence, benchmark methodology, model selection, and Core ML deployment notes for an on-device AI-generated-image detector.
site_author: DefAIke contributors
copyright: Nonprofit research project. Dataset and model licences are documented per asset.

docs_dir: docs
site_dir: site
strict: true

nav:
  - Overview: index.md
  - Current status: status.md
  - Research:
      - Landscape and decisions: research/landscape.md
  - Methodology:
      - Corpus and licences: methodology/corpus.md
      - Benchmark protocol: methodology/benchmark.md
  - Results:
      - Model selection: results/model-selection.md
      - Shipping model card: results/shipping-model.md
      - Core ML deployment gate: results/coreml.md
  - Engineering:
      - Benchmark harness: engineering/harness.md
      - Reproduce the work: engineering/reproduce.md
      - Artifact registry: engineering/artifacts.md
  - iOS app:
      - Overview: ios-app/index.md
      - Architecture and modules: ios-app/architecture.md
      - Build, test, and release tooling: ios-app/build-and-test.md
      - Implementation status: ios-app/status.md
  - Project state:
      - Limitations and next boundary: project/limitations.md
  - Primary references: references.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  evidence_snapshot: August 2026
