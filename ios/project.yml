# DefAIke iOS Xcode project specification (XcodeGen).
#
# The .xcodeproj is generated, not committed: run
#   ios/Scripts/generate-xcode-project.sh
# and open ios/DefAIke.xcworkspace.
#
# One app ships, from one capability composition:
#
#   DefAIkeApp    links DefAIkeAppKit, which links the reviewed validator
#
# It compiles both Version 1 evidence capabilities, pixel analysis and Content
# Credential validation, so a single install carries both source lanes. Compiling
# the validator is not enabling it: the Provenance Feasibility Gate and the signed
# Release Capability Manifest decide that, never a build setting here.
#
# This replaces a two-target arrangement (DefAIkeApp-PixelOnly and
# DefAIkeApp-PixelPlusProvenance) that shipped the capability sets as separate
# signed archives with distinct bundle identifiers and App Groups. That split
# existed so gate evidence could not be pooled across capability sets
# (Requirements 13.18 through 13.22). With one composition there is exactly one
# enabled capability set, so there is nothing to pool: 13.20's prohibition on
# combining evidence from different capability sets is satisfied by there being
# only one, rather than by keeping two apart.
#
# Unresolved release-controlled values are deliberately absent here: signing team
# and key policy, the distributed build identity, the device allowlist, resource
# budgets, lifecycle deadlines, and capability approval all arrive as approved
# artifacts and gates, not as build settings.

name: DefAIke

options:
  bundleIdPrefix: dev.defaike
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

# Local, uncommitted overrides: the developer's Apple team identifier and an
# optional bundle-identifier prefix. Seeded from Local.xcconfig.example by
# Scripts/generate-xcode-project.sh, gitignored, and empty by default — so the
# committed spec's behaviour is unchanged until someone fills it in.
#
# It has to be a config file rather than a value here: the .xcodeproj is generated
# and not committed, so a team identifier set in Xcode's Signing & Capabilities tab
# is discarded on the next regeneration.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  DefAIkePackage:
    path: DefAIkePackage

settings:
  base:
    # Requirement 1.1: iPhone-only. Requirement 1.2: iOS 17.0 or later.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

    # Matches swiftLanguageModes: [.v6] in DefAIkePackage/Package.swift.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES

    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

    # The Release Process supplies the distributed build identity and signing
    # policy. These local values are not a release version claim, and nothing in
    # the application reads either of them as one: the build identity the Release
    # Approved iPhone Allowlist is keyed on is DefAIkeAppBuildID, a separate
    # release-controlled Info.plist key, and ObservedDeviceIdentity refuses to
    # substitute CFBundleVersion or CFBundleShortVersionString for it whatever
    # values they hold.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Empty unless a developer sets DEFAIKE_LOCAL_DEVELOPMENT_TEAM in the
    # gitignored Local.xcconfig. Still not a release value: the substitution
    # resolves to empty in every checkout that has not been edited locally, which
    # is the same fail-closed default this setting has always carried.
    DEVELOPMENT_TEAM: $(DEFAIKE_LOCAL_DEVELOPMENT_TEAM)
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  DefAIkeApp:
    type: application
    platform: iOS
    sources:
      - path: DefAIkeApp/Shared
      - path: DefAIkeApp/Support/Info.plist
        buildPhase: none
      - path: DefAIkeApp/Support/DefAIkeApp.entitlements
        buildPhase: none
      # ----------------------------------------------------------------------
      # The DEVELOPMENT pixel model. DEBUG ONLY — excluded from Release below.
      # ----------------------------------------------------------------------
      #
      # Xcode's Core ML compiler turns this .mlpackage into
      # commfor-lowq-384.mlmodelc at the app bundle's resource root, which is
      # where DevelopmentModelBundle.installedRoot resolves.
      #
      # The .mlpackage is the form .gitignore already tracks ("the one heavy
      # artifact we do track"), so a fresh clone on another machine has it and
      # nothing new is committed to make a device build work. Only the compiled
      # .mlmodelc is ignored, and it is now produced at build time rather than
      # read out of the developer's working tree — which is what a physical
      # device cannot do.
      #
      # It is NOT an approved Initial Model Bundle. Requirement 10.1 packages a
      # signed one inside the distributed application; this is an unverified
      # model behind a fabricated activation receipt, and DEBUG-only for that
      # reason. See DevelopmentModelBundle.swift.
      - path: ../data/coreml/commfor-lowq-384.mlpackage
    settings:
      base:
        PRODUCT_NAME: DefAIke
        PRODUCT_BUNDLE_IDENTIFIER: $(DEFAIKE_LOCAL_BUNDLE_PREFIX).app
        DEFAIKE_APP_GROUP_ID: group.$(DEFAIKE_LOCAL_BUNDLE_PREFIX).app
        INFOPLIST_FILE: DefAIkeApp/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: DefAIkeApp/Support/DefAIkeApp.entitlements
        # XcodeGen's iOS target presets default to "1,2", which would offer the
        # app on iPad. Requirement 1.1 is iPhone-only, so override per target.
        TARGETED_DEVICE_FAMILY: "1"
      # ----------------------------------------------------------------------
      # DEBUG-ONLY development identifiers. NOT RELEASE VALUES.
      # ----------------------------------------------------------------------
      #
      # Info.plist declares the five release-controlled keys the composition root
      # reads. Their values are set here, and only in the Debug configuration, so
      # they reach a locally provisioned Simulator build and nothing else.
      #
      # A Release build leaves every one of them unset, the plist substitutions
      # resolve to empty, and MainAppReleaseProvisioning.installedIdentifiers
      # reports each one as the UnprovisionedReleaseInput it is — exactly as it
      # does today. Setting them at `base` would bake development identifiers into
      # a shipping Info.plist, which is a release claim this repository must not
      # make.
      #
      # Each value is namespaced `local-development` so an identifier from this
      # seam is recognizable wherever it is recorded. They previously carried a
      # per-composition suffix so gate evidence could not be pooled across two
      # capability sets; with one composition there is one capability set, and the
      # suffix named a distinction that no longer exists.
      configs:
        Debug:
          DEFAIKE_APP_BUILD_ID: build.local-development
          DEFAIKE_CAPABILITY_MANIFEST_ID: manifest.local-development
          DEFAIKE_VERDICT_COPY_CATALOG_ID: catalog.local-development.verdict-copy
          DEFAIKE_EMBEDDED_MODEL_BUNDLE_ID: bundle.local-development
          # The application's own pixel-analysis implementation version. Not a
          # third-party release: no linked adapter reports it, so unlike the
          # provenance validator's version it has to arrive as a provisioned
          # value. SchemaSemanticVersion rejects 0.0.0, so a placeholder here
          # would be a refusal rather than a silent pass.
          DEFAIKE_PIXEL_ANALYSIS_IMPLEMENTATION_VERSION: "1.0.0"
          DEFAIKE_EVIDENCE_FUSION_IMPLEMENTATION_VERSION: "1.0.0"
        Release:
          # Keeps the development model out of a Release archive.
          #
          # Not a size optimisation. `check-offline-privacy-archive.py` records
          # "no Core ML artifact in the archive; 10.1's positive claim is
          # unestablishable from these bytes" as a gap observation. An unapproved
          # model sitting in a Release archive would retire that observation and
          # read as Requirement 10.1 satisfied, when no signed Initial Model
          # Bundle exists and nothing verified these bytes. A Release build
          # refuses at its first startup step anyway, so it has no use for a
          # model.
          EXCLUDED_SOURCE_FILE_NAMES: commfor-lowq-384.mlpackage
    dependencies:
      - package: DefAIkePackage
        product: DefAIkeAppKit
      - target: DefAIkeShareExtension

  DefAIkeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DefAIkeShareExtension/Sources
      - path: DefAIkeShareExtension/Support/Info.plist
        buildPhase: none
      - path: DefAIkeShareExtension/Support/DefAIkeShareExtension.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: DefAIkeShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(DEFAIKE_LOCAL_BUNDLE_PREFIX).app.share
        DEFAIKE_APP_GROUP_ID: group.$(DEFAIKE_LOCAL_BUNDLE_PREFIX).app
        INFOPLIST_FILE: DefAIkeShareExtension/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: DefAIkeShareExtension/Support/DefAIkeShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      # Transfer and domain only. Adding an inference, image-pipeline, model-bundle,
      # or provenance dependency here violates the Extension Execution Policy and
      # is rejected by ios/Scripts/check-module-boundaries.py.
      #
      # This is now also the only shipping module closure that provably links no
      # Content Credential validator, which is what keeps the app's positive
      # linkage measurement non-vacuous: with one app archive there is no second
      # one to supply the negative case.
      - package: DefAIkePackage
        product: DefAIkeShareExtensionKit

  DefAIkeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/DefAIkeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DEFAIKE_LOCAL_BUNDLE_PREFIX).app.uitests
        TEST_TARGET_NAME: DefAIkeApp
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DefAIkeApp

  DefAIkeDeviceValidationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DefAIkeDeviceValidationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DEFAIKE_LOCAL_BUNDLE_PREFIX).app.devicetests
        TARGETED_DEVICE_FAMILY: "1"
        # Name the app target the same way the UITests target does, so the host
        # relationship is declared by target and the build system resolves the
        # product itself instead of a hard-coded path.
        TEST_TARGET_NAME: DefAIkeApp
        # TEST_HOST is deliberately empty, which is not the same as absent.
        #
        # For a unit-test bundle that depends on an application target, XcodeGen
        # injects, unless the spec already sets TEST_HOST:
        #   TEST_HOST = $(BUILT_PRODUCTS_DIR)/<app TARGET name>.app/<app TARGET name>
        # This target overrides PRODUCT_NAME to DefAIke, so that injected path
        # never exists and build-for-testing fails with "Could not find test
        # host". Declaring TEST_HOST here is the only way to stop the injection.
        #
        # It is left empty rather than pointed at the real product path because
        # $(PRODUCT_NAME) is unusable here — inside a test target it is the test
        # bundle's own name, not the app's. So this bundle runs un-hosted, next to
        # the app rather than inside it. Hosting it would require spelling
        # DefAIke.app literally, coupling this target to the app's PRODUCT_NAME,
        # and is not done here.
        #
        # (A second reason applied while two app targets built the same
        # DefAIke.app: any TEST_HOST path matched both, so implicit-dependency
        # resolution pulled both into one graph and the build failed with
        # "Multiple commands produce .../DefAIke.app". That reason is gone with
        # the second target; the PRODUCT_NAME reason above is not.)
        TEST_HOST: ""
    dependencies:
      - target: DefAIkeApp
      - package: DefAIkePackage
        product: DefAIkeReleaseValidation

schemes:
  DefAIkeApp:
    build:
      targets:
        DefAIkeApp: all
        DefAIkeShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DefAIkeDeviceValidationTests
        - DefAIkeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
