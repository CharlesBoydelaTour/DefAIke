[project]
name = "defaike-bench"
version = "0.1.0"
description = "Evaluation harness for the on-device AI-image detector. Phase 0."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "polars>=1.9.0",
    "huggingface-hub>=0.26.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "tqdm>=4.66.0",
    "numpy>=2.1.0",
    # AncesTree draws 46% of its compressions from cv2's JPEG encoder and 47% from
    # Pillow's. The two produce measurably different output at the same quality factor,
    # so reproducing the published degradation distribution needs both.
    "opencv-python-headless>=4.10.0",
    "scipy>=1.14.0",
]

[project.scripts]
bench = "bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "piexif>=1.1.3",  # synthesises EXIF fixtures for the metadata probe tests
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test requires network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
